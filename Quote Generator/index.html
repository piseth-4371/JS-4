<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="../output.css">
    <link rel="stylesheet" href="../input.css">
</head>
<body class="bg-emerald-300">
    <div class="relative font-mono bg-white p-10 lg:p-5 m-auto my-10 rounded-lg shadow-lg w-10/12 sm:w-8/12 flex items-center justify-between flex-col ">
        <h1 class="text-4xl font-bold border-b-[#1DA1F2] my-3">Quote of the day</h1>
        <blockquote id="quote" class="text-2xl font-semibold my-5 w-70">Loading...</blockquote>
        <span id="author" class="relative mb-5">Loading...</span>
        <div class="flex mt-14 mb-5 items-center w-full justify-center relative">
            <button onclick="getQuote(api_url)" class="cursor-pointer w-40 h-auto py-4 px-2 text-lg mx-2 bg-[#1DA1F2] text-white rounded-full ">New Quote</button>
            <button onclick="x()" class="cursor-pointer w-40 h-auto py-4 px-2 text-lg mx-2 bg-[#ffffff]  text-[#000000] rounded-full border-[#1DA1F2] border flex items-center justify-center">
                <img src="images/twitter-alt-circle.png" alt="" class="w-7 h-7">
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
